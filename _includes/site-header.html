<header class="site-header" role="banner">
  <div class="brand-wrap">
    <h1 class="site-title"><a href="{{ '/' | relative_url }}" rel="home">Downtown Shotokan Karate</a></h1>
    <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav class="main-navigation" aria-label="Primary navigation">
    <div class="menu-wrap">
      <ul id="site-menu" class="nav-menu">
        {% for item in site.data.navigation.main %}
          <li class="menu-item{% if item.children %} menu-item-has-children{% endif %}">
            <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
            {% if item.children %}
              <ul class="sub-menu">
                {% for child in item.children %}
                  <li class="menu-item"><a href="{{ child.url | relative_url }}">{{ child.title }}</a></li>
                {% endfor %}
              </ul>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </div>
  </nav>

  <a class="header-banner" href="{{ '/' | relative_url }}" aria-label="Downtown Shotokan Karate home">
    <img src="{{ '/assets/images/header-banner.jpg' | relative_url }}" alt="Downtown Shotokan Karate" width="940" height="284">
  </a>
</header>
